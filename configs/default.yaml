# popsynth configuration (highest-quality defaults, meant for the CUDA/gsplat machine).
# For quick previews on a laptop use configs/mac_preview.yaml (same settings at lower resolution).
# All randomness derives from `seed`, so the same config + seed reproduces the same dataset.
# Override any key on the command line: --set compose.num_images=10000
seed: 0

splat:
  path: assets/popillia_ex15.ply
  # Direction of the beetle's back (dorsal side) in the splat's own coordinates.
  # Used so that `elevation_deg: 90` means "looking down onto the back".
  # (For popillia_ex15.ply this is the smallest principal axis; check with `popsynth info`.)
  up: [-0.257, -0.098, -0.962]
  clean:
    opacity_min: 0.01      # drop near-transparent gaussians (speeds up rendering, no visible change)
    max_scale: null        # drop gaussians larger than this fraction of the object radius (e.g. 0.3)
    radius_crop: null      # drop gaussians further than this many object radii from the centre (e.g. 1.5)
    box: null              # [[xmin,ymin,zmin],[xmax,ymax,zmax]] crop in splat coordinates

render:
  backend: auto            # gsplat (CUDA) | torch (CPU/MPS/CUDA, slower) | auto
  device: auto             # cuda | mps | cpu | auto
  size: 2048               # sprite resolution (square); sprites are scaled down when composited, never up
  supersample: 2           # render at size*supersample and area-downsample (sharper, no aliasing)
  antialiased: true        # Mip-Splatting style opacity compensation for gaussians smaller than a pixel
  num_sprites: 24          # distinct rendered views. Full run: ~2000 (sprites are re-used with different backgrounds)
  val_fraction: 0.15       # these sprites are reserved for the validation split (unseen viewpoints)
  camera:
    elevation_deg: [0, 90]     # -90 = from below, 0 = side view, 90 = top-down. The underside of the splat is
                               # reconstructed less well, so views from below are off by default
    azimuth_deg: [0, 360]
    roll_deg: [-180, 180]      # in-plane rotation
    fov_deg: [25, 70]          # narrow = telephoto/flat, wide = close-up perspective distortion
    fill: [0.75, 0.92]         # fraction of the sprite frame covered by the object's bounding sphere
    center_jitter: 0.05

backgrounds:
  # any folders of jpg/png; see scripts/download_backgrounds.py.  flowers102 = close-up plants
  # (scale matches a 1 cm beetle), places365 = outdoor scenes (more variety, human scale).
  # inat_hostplants = iNaturalist CC photos of Popillia host plants, up to 2048 px (best quality + realism).
  # Missing folders are skipped with a warning.
  # weight = probability of picking that folder (then a random file inside it), independent of folder size.
  dirs:
    - {path: data/backgrounds/inat_hostplants, weight: 0.6}
    - {path: data/backgrounds/flowers102, weight: 0.25}
    - {path: data/backgrounds/places365, weight: 0.15}
  crop_scale: [0.5, 1.0]               # random crop size as a fraction of the background image
  min_size: 512                        # skip background files whose shorter side is below this
  hflip: 0.5

compose:
  num_images: 10           # keep small while validating; full run: 10000
  image_size: [1024, 1024] # output resolution [width, height]; the CNN input size is applied at training time
  val_fraction: 0.15
  positive_fraction: 0.5   # the rest are background-only negatives ("background" class)
  objects_per_image: [1, 3]   # beetles per positive image (uniform in this range); [1, 1] for exactly one
  object_size: [0.12, 0.85]   # beetle's longest side as a fraction of the shorter image side (distance)
  min_visible: 1.0            # fraction of the object that must stay inside the frame (1.0 = never cut by the edge)
  color_match: [0.0, 0.25]    # strength of pulling the beetle's tint/brightness toward the background (keep low)
  edge_blur_px: [0.3, 1.0]
  defocus: {prob: 0.15, sigma_px: [0.4, 1.0]}
  shadow: {prob: 0.8, strength: [0.2, 0.6], blur: [0.03, 0.12], offset: [0.0, 0.08]}

lighting:
  # sampled per image, applied to the whole composite. weights are relative probabilities.
  day:      {weight: 0.55, exposure: [0.8, 1.3],  tint: [[0.95, 1.05], [0.95, 1.05], [0.9, 1.05]],
             contrast: [0.9, 1.2], saturation: [0.9, 1.2], noise: [0.0, 0.02], vignette: [0.0, 0.2]}
  overcast: {weight: 0.20, exposure: [0.6, 1.0],  tint: [[0.9, 1.0], [0.95, 1.05], [1.0, 1.1]],
             contrast: [0.7, 1.0], saturation: [0.6, 0.95], noise: [0.0, 0.03], vignette: [0.0, 0.2]}
  dusk:     {weight: 0.10, exposure: [0.35, 0.7], tint: [[1.0, 1.15], [0.85, 1.0], [0.7, 0.95]],
             contrast: [0.8, 1.1], saturation: [0.7, 1.1], noise: [0.01, 0.05], vignette: [0.1, 0.4]}
  night:    {weight: 0.15, exposure: [0.15, 0.4], tint: [[0.75, 0.95], [0.85, 1.0], [1.0, 1.25]],
             contrast: [0.7, 1.0], saturation: [0.3, 0.8], noise: [0.03, 0.10], vignette: [0.2, 0.6],
             flash_prob: 0.4}

camera_effects:
  # Real photos are never perfect. Each image draws a quality tier by weight; within a tier every
  # imperfection has its own probability. 'bad' images are clearly degraded on purpose
  # (blur, shake, low resolution, haze, bad exposure, noise, heavy compression).
  tiers:
    clean: {weight: 0.45, jpeg_quality: [85, 98]}
    mild:  {weight: 0.35, blur_prob: 0.4, motion_px: [3, 9], defocus_prob: 0.4, defocus_sigma: [0.6, 1.6],
            lowres_prob: 0.3, lowres_factor: [1.5, 2.5], haze_prob: 0.2, haze: [0.1, 0.3],
            exposure_fault_prob: 0.2, overexposure: [1.4, 2.0], underexposure: [0.4, 0.6],
            noise: [0.0, 0.03], jpeg_quality: [55, 90]}
    bad:   {weight: 0.20, blur_prob: 0.5, motion_px: [9, 25], defocus_prob: 0.45, defocus_sigma: [1.6, 4.0],
            lowres_prob: 0.4, lowres_factor: [2.5, 5.0], haze_prob: 0.3, haze: [0.25, 0.5],
            exposure_fault_prob: 0.4, overexposure: [1.8, 2.8], underexposure: [0.2, 0.4],
            noise: [0.02, 0.08], jpeg_quality: [20, 55]}

output:
  dir: outputs/dataset
  image_format: png        # lossless; use jpg + jpeg_quality to save disk space
  jpeg_quality: 95
  write_masks: true
  write_yolo: true
